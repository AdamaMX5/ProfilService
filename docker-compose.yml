version: '3.9'

services:
  profilservice:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      # Zentrale MongoDB-Instanz — profilservice bekommt hier nur seine eigene DB
      # innerhalb der geteilten Instanz, kein dedizierter Mongo-Container mehr.
      - MONGODB_URI=${MONGODB_URI}
      - AUTH_SERVER_URL=https://auth.freischule.info
      - NODE_ENV=production
    restart: unless-stopped
